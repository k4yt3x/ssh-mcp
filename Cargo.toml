[package]
name = "ssh-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "An MCP server that gives an agent persistent SSH connections, shells, file transfer and forwarding"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
getrandom = { version = "0.4", features = ["std"] }
hmac = "0.13"
regex = "1"
rmcp = { version = "3.9", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
russh = { version = "0.65", default-features = false, features = [
    "ring",
    "rsa",
    "flate2",
    "des",
    "dsa",
] }
russh-sftp = "3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "0.18"

[dev-dependencies]
rmcp = { version = "3.9", features = ["client", "transport-async-rw"] }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
pty-process = { version = "0.5", features = ["async"] }

[lints.clippy]
await_holding_lock = "deny"
expect_used = "warn"
indexing_slicing = "warn"
match_wildcard_for_single_variants = "warn"
panic = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"
unreachable = "warn"
unused_async = "warn"
unwrap_used = "warn"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
